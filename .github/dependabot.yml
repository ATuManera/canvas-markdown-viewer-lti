version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request per group keeps the review load reasonable while still
      # separating the security-critical dependencies from the rest.
      security-critical:
        patterns:
          - jose
          - isomorphic-dompurify
          - dompurify
          - markdown-it
          - highlight.js
      fastify:
        patterns:
          - fastify
          - '@fastify/*'
      development:
        dependency-type: development
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: chore
